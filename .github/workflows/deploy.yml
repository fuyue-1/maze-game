name: Test & Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: 算法单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 迷宫生成与 BFS 测试
        run: node tests/maze.test.js

      - name: 视线追踪与迷雾测试
        run: node tests/los.test.js

  deploy:
    name: 部署到 GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      BMOB_APP_ID: ${{ secrets.BMOB_APP_ID }}
      BMOB_REST_KEY: ${{ secrets.BMOB_REST_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 准备站点目录 & 替换Bmob密钥
        run: |
          mkdir -p _site
          cp -r index.html css js vendor _site/
          cp standalone.html _site/ 2>/dev/null || true
          test -f _site/vendor/three.min.js || { echo "✗ vendor/three.min.js 未进入站点目录"; exit 1; }
          
          node -e "
            const fs = require('fs');
            let txt = fs.readFileSync('./_site/js/bmob.js', 'utf8');
            function toSingleQuoteStr(s){ return \"'\" + s.replace(/'/g, \"\\'\") + \"'\"; }
            txt = txt.replace(/'BMOB_APP_ID'/g, toSingleQuoteStr(process.env.BMOB_APP_ID));
            txt = txt.replace(/'BMOB_REST_KEY'/g, toSingleQuoteStr(process.env.BMOB_REST_KEY));
            fs.writeFileSync('./_site/js/bmob.js', txt, 'utf8');
            const lines = txt.split('\n').filter(l=>l.includes('APPLICATION_ID')||l.includes('REST_API_KEY'));
            console.log('替换后的配置行：', lines);
          "

      - name: 打包站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
