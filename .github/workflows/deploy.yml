name: Test & Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: 算法单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 迷宫生成与 BFS 测试
        run: node tests/maze.test.js

      - name: 视线追踪与迷雾测试
        run: node tests/los.test.js

  deploy:
    name: 部署到 GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      BMOB_APP_ID: ${{ secrets.BMOB_APP_ID }}
      BMOB_REST_KEY: ${{ secrets.BMOB_REST_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 准备站点目录 & 替换Bmob密钥
        run: |
          mkdir -p _site
          cp -r index.html css js vendor _site/
          cp standalone.html _site/ 2>/dev/null || true
          test -f _site/vendor/three.min.js || { echo "✗ vendor/three.min.js 未进入站点目录"; exit 1; }
          
          # 使用 | 作为sed分隔符，避免key里带/导致替换失败
          sed -i "s|'BMOB_APP_ID'|'${BMOB_APP_ID}'|g" ./_site/js/bmob.js
          sed -i "s|'BMOB_REST_KEY'|'${BMOB_REST_KEY}'|g" ./_site/js/bmob.js
          
          # 【调试用，上线前注释掉！】打印文件片段看是否替换成功，secret会被***掩码，只能看有没有替换动作
          # cat ./_site/js/bmob.js | grep BMOB

      - name: 打包站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
